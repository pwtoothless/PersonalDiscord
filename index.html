<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <form id="login-form">
            <h2>Login</h2>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div style="text-align: center; margin-bottom: 1rem;">
                <a href="register.html" style="color: #007bff; text-decoration: none;">Create an account</a>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

    <div class="app-wrapper" id="app-wrapper" style="display: none;">
        <div class="glass-container">
            <div class="sidebar">
                <h3>Connected Users</h3>
                <ul id="user-list"></ul>
                
                <div class="voice-channels">
                    <h3>Voice Channels</h3>
                    <ul id="channel-list">
                        <li onclick="joinVoiceChannel('General')">
                            &#128266; General
                            <div class="channel-users" id="voice-users-General"></div>
                        </li>
                        <li onclick="joinVoiceChannel('Gaming')">
                            &#128266; Gaming
                            <div class="channel-users" id="voice-users-Gaming"></div>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-history" id="chat-history"></div>
                <div class="input-area">
                    <input type="text" id="chat-input" placeholder="Type a message...">
                </div>
                <div class="video-controls" style="padding: 10px; background: rgba(255,255,255,0.1); display: flex; gap: 10px;">
                <button onclick="startCamera()">Turn on Camera</button>
                <button onclick="startScreenShare()">Share Screen</button>
            </div>
        </div>
    </div>
    <div id="video-modal" class="video-modal" style="display: none;">
        <div class="video-modal-content glass-container">
            <div class="video-header">
                <h3>Live Streams</h3>
                <button onclick="document.getElementById('video-modal').style.display='none'">Hide</button>
            </div>
                <div id="video-grid" class="video-grid">
            </div>
        </div>
    </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
